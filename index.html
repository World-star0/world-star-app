<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>World Star Voice Room</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />

    <!-- React & ReactDOM (Global Variables) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    
    <!-- Firebase Compat (Global Variables) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    
    <!-- Cropper -->
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" />
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 🔥 YE LINE SABSE IMPORTANT HAI: Babel ko Classic mode me chalane ke liye 🔥 -->
    <script>
      Babel.registerPreset('react-classic', {
        presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
      });
    </script>

    <script>
      window.addEventListener('error', function(e) {
        const root = document.getElementById('root');
        if(root && root.innerHTML === '') {
           root.innerHTML = '<div style="color:white; padding:20px; font-family:sans-serif;"><h2>Loading Error:</h2><p>' + (e.message || 'Unknown Error') + '</p></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- 🔥 DHYAN DE: Yahan data-presets="react-classic" karna hai, "react" nahi 🔥 -->
    <script type="text/babel" data-presets="react-classic" src="script.js"></script>
  </body>
</html>
